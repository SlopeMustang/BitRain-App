name: 문제 신고
description: 재생이 안 되거나, 소리가 이상하거나, 앱이 오작동할 때
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다.

        **진단 스냅샷을 함께 넣어 주시면** 원인을 훨씬 빨리 좁힐 수 있습니다.
        앱에서 **도움말 › BitRain 도움말 › 진단 › 진단 스냅샷 복사**를 누르면 클립보드에 담깁니다.

  - type: textarea
    id: symptom
    attributes:
      label: 무슨 일이 일어났습니까
      description: 어떤 상황에서 무엇이 잘못됐는지 적어 주십시오.
      placeholder: |
        예) 96kHz FLAC을 재생하면 DAC이 44.1kHz에 머물고 소리가 빨리 감기처럼 들립니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 같은 상황을 다시 만들려면 무엇을 하면 됩니까.
      placeholder: |
        1. 설정에서 업샘플링을 Max로 둔다
        2. 44.1kHz 트랙을 재생한다
        3. 다음 곡(96kHz)으로 넘어간다
    validations:
      required: false

  - type: textarea
    id: snapshot
    attributes:
      label: 진단 스냅샷
      description: |
        **도움말 › BitRain 도움말 › 진단 › 진단 스냅샷 복사** 로 얻은 내용을 그대로 붙여넣어 주십시오.
        앱 설정 · 오디오 장치 · 라이브러리 통계 · 하드웨어 사양이 들어 있습니다.
        음악 파일의 내용이나 개인 정보는 담기지 않으며, 붙여넣기 전에 직접 확인하실 수 있습니다.
      render: json
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 사용 중인 DAC / 오디오 인터페이스
      description: 스냅샷에도 들어가지만, 같은 장치의 사례를 모으기 위해 따로 받습니다.
      placeholder: 예) Topping D90 III Sabre / 내장 스피커 / RME ADI-2
    validations:
      required: false

  - type: input
    id: storage
    attributes:
      label: 음악 파일을 어디에 두셨습니까
      description: NAS라면 제조사와 연결 방식(SMB/NFS)까지 적어 주시면 좋습니다.
      placeholder: 예) Synology DS920+ (SMB) / 내장 SSD / 외장 USB HDD
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: 로그 (선택)
      description: |
        재현 직후의 로그가 있으면 결정적입니다.
        **도움말 › BitRain 도움말 › 진단 › 로그 파일 보기** 로 위치를 열 수 있습니다.
        파일이 크면 문제가 일어난 시각 앞뒤만 잘라 붙여 주십시오.
      render: shell
    validations:
      required: false
